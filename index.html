<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Warehouse · RAK-01</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Design tokens */
        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-2: #f1f3f7;
            --border: #e4e7ec;
            --text: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;

            --accent: #2563eb;
            --accent-soft: #eff6ff;

            --success: #059669;
            --success-soft: #ecfdf5;

            --danger: #dc2626;
            --danger-soft: #fef2f2;

            --warning: #d97706;
            --warning-soft: #fffbeb;

            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px;
            font-size: 14px;
            line-height: 1.5;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 15px;
        }

        .brand-info h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand-info p {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .status-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-subtle);
        }

        .status-pill[data-state="connected"] {
            color: var(--success);
            background: var(--success-soft);
            border-color: transparent;
        }

        .status-pill[data-state="connected"] .dot {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-pill[data-state="connecting"] {
            color: var(--warning);
            background: var(--warning-soft);
            border-color: transparent;
        }

        .status-pill[data-state="connecting"] .dot {
            background: var(--warning);
            animation: pulse 1s ease-in-out infinite;
        }

        .status-pill[data-state="error"] {
            color: var(--danger);
            background: var(--danger-soft);
            border-color: transparent;
        }

        .status-pill[data-state="error"] .dot {
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Metric cards */
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.2s ease;
        }

        .metric:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow);
        }

        .metric-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .metric-label svg {
            width: 14px;
            height: 14px;
            opacity: 0.6;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            display: flex;
            align-items: baseline;
            gap: 4px;
            transition: color 0.3s ease;
        }

        .metric-value .unit {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-subtle);
        }

        .metric-value.is-kosong { color: var(--danger); }
        .metric-value.is-tersedia { color: var(--success); }
        .metric-value.is-restock { color: var(--warning); }
        .metric-value.is-normal { color: var(--text); }

        /* Control section */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.005em;
        }

        .section-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            background: var(--surface-2);
            border-color: #cbd5e1;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn-success {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-success:hover:not(:disabled) {
            background: #047857;
            border-color: #047857;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .btn-danger:hover:not(:disabled) {
            background: #b91c1c;
            border-color: #b91c1c;
        }

        /* Activity log */
        .log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.7;
            max-height: 240px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .log-entry {
            display: flex;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-muted);
            word-break: break-word;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .ts {
            color: var(--text-subtle);
            flex-shrink: 0;
            font-size: 11px;
        }

        .log-entry.info { color: var(--text); }
        .log-entry.success { color: var(--success); }
        .log-entry.warn { color: var(--warning); }
        .log-entry.error { color: var(--danger); }

        .log::-webkit-scrollbar {
            width: 6px;
        }

        .log::-webkit-scrollbar-track {
            background: transparent;
        }

        .log::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 3px;
        }

        .log::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .btn-ghost {
            padding: 6px 10px;
            font-size: 12px;
            background: transparent;
            border-color: transparent;
            color: var(--text-muted);
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--surface-2);
            border-color: transparent;
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-subtle);
            font-size: 12px;
            padding: 24px 0 8px;
        }

        footer code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface-2);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .metrics { grid-template-columns: 1fr; }
            .actions { grid-template-columns: 1fr; }
            .metric-value { font-size: 24px; }
            header { margin-bottom: 20px; }
        }

        /* Entry animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric, .section {
            animation: slideUp 0.4s ease backwards;
        }

        .metric:nth-child(1) { animation-delay: 0.05s; }
        .metric:nth-child(2) { animation-delay: 0.1s; }
        .metric:nth-child(3) { animation-delay: 0.15s; }
        .section:nth-of-type(1) { animation-delay: 0.2s; }
        .section:nth-of-type(2) { animation-delay: 0.25s; }
    </style>
</head>
<body>

<div class="container">

    <header>
        <div class="brand">
            <div class="brand-mark">SW</div>
            <div class="brand-info">
                <h1>Smart Warehouse</h1>
                <p>RAK-01 · Kelompok 1</p>
            </div>
        </div>
        <div class="status-pill" id="status" data-state="connecting">
            <span class="dot"></span>
            <span id="status-text">Menghubungkan</span>
        </div>
    </header>

    <div class="metrics">
        <div class="metric">
            <div class="metric-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h3l3-8 4 16 3-8h5"/>
                </svg>
                Jarak Sensor
            </div>
            <div class="metric-value" id="val-distance">
                -- <span class="unit">cm</span>
            </div>
        </div>

        <div class="metric">
            <div class="metric-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 9h6v6H9z"/>
                </svg>
                Status Rak
            </div>
            <div class="metric-value" id="val-status">--</div>
        </div>

        <div class="metric">
            <div class="metric-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                Mode Sistem
            </div>
            <div class="metric-value" id="val-mode">--</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <div>
                <div class="section-title">Kontrol Operasional</div>
                <div class="section-subtitle">Kelola mode restock dari jarak jauh</div>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-success" id="btn-on" onclick="sendCommand('restock_on')" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Aktifkan Restock
            </button>
            <button class="btn btn-danger" id="btn-off" onclick="sendCommand('restock_off')" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
                Matikan Restock
            </button>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <div>
                <div class="section-title">Log Aktivitas</div>
                <div class="section-subtitle">Riwayat pesan MQTT real-time</div>
            </div>
            <button class="btn btn-ghost" onclick="clearLog()">Bersihkan</button>
        </div>
        <div class="log" id="log"></div>
    </div>

    <footer>
        Smart Warehouse &copy; 2026 · <code>scm/warehouse/rak-1/kelompok1</code>
    </footer>

</div>

<script>
    // Konfigurasi MQTT
    const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
    const TOPIC_DATA = 'scm/warehouse/rak-1/kelompok1';
    const TOPIC_CONTROL = 'scm/warehouse/rak-1/kelompok1/control';

    let client = null;
    let isConnected = false;

    // Log
    const logEl = document.getElementById('log');

    function log(message, type = 'info') {
        const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const row = document.createElement('div');
        row.className = `log-entry ${type}`;
        row.innerHTML = `<span class="ts">${t}</span><span>${message}</span>`;
        logEl.appendChild(row);
        logEl.scrollTop = logEl.scrollHeight;

        while (logEl.children.length > 80) {
            logEl.removeChild(logEl.firstChild);
        }
    }

    function clearLog() {
        logEl.innerHTML = '';
        log('Log dibersihkan');
    }

    // Status UI
    function setConnectionState(state, text) {
        const pill = document.getElementById('status');
        pill.dataset.state = state;
        document.getElementById('status-text').textContent = text;

        const enabled = state === 'connected';
        document.getElementById('btn-on').disabled = !enabled;
        document.getElementById('btn-off').disabled = !enabled;
    }

    function updateMetrics(data) {
        // Jarak
        const distEl = document.getElementById('val-distance');
        distEl.innerHTML = `${data.jarak_cm} <span class="unit">cm</span>`;

        // Status
        const statusEl = document.getElementById('val-status');
        statusEl.textContent = data.status.toUpperCase();
        statusEl.className = 'metric-value ' + (data.status === 'kosong' ? 'is-kosong' : 'is-tersedia');

        // Mode
        const modeEl = document.getElementById('val-mode');
        modeEl.textContent = data.restock_mode ? 'RESTOCK' : 'NORMAL';
        modeEl.className = 'metric-value ' + (data.restock_mode ? 'is-restock' : 'is-normal');
    }

    // Koneksi MQTT
    function connect() {
        log('Menghubungkan ke broker...');
        setConnectionState('connecting', 'Menghubungkan');

        client = mqtt.connect(BROKER, {
            clientId: 'dashboard_' + Math.random().toString(16).slice(2, 10),
            clean: true,
            reconnectPeriod: 3000,
            connectTimeout: 10000,
            keepalive: 30
        });

        client.on('connect', () => {
            isConnected = true;
            setConnectionState('connected', 'Terhubung');
            log('Terhubung ke broker MQTT', 'success');

            client.subscribe(TOPIC_DATA, { qos: 0 }, (err) => {
                if (err) {
                    log(`Gagal subscribe: ${err.message}`, 'error');
                } else {
                    log(`Subscribe: ${TOPIC_DATA}`);
                }
            });
        });

        client.on('message', (topic, payload) => {
            if (topic !== TOPIC_DATA) return;
            try {
                const data = JSON.parse(payload.toString());
                updateMetrics(data);
                log(`Jarak ${data.jarak_cm}cm · ${data.status} · ${data.restock_mode ? 'RESTOCK' : 'NORMAL'}`);
            } catch (err) {
                log(`Parse error: ${err.message}`, 'error');
            }
        });

        client.on('reconnect', () => {
            log('Mencoba reconnect...', 'warn');
            setConnectionState('connecting', 'Menyambung ulang');
        });

        client.on('close', () => {
            if (isConnected) log('Koneksi terputus', 'warn');
            isConnected = false;
            setConnectionState('error', 'Terputus');
        });

        client.on('error', (err) => {
            log(`Error: ${err.message}`, 'error');
            setConnectionState('error', 'Error');
        });
    }

    // Kirim perintah
    function sendCommand(cmd) {
        if (!client || !isConnected) {
            log('Tidak dapat mengirim: belum terhubung', 'error');
            return;
        }

        client.publish(TOPIC_CONTROL, cmd, { qos: 0 }, (err) => {
            if (err) {
                log(`Gagal kirim "${cmd}": ${err.message}`, 'error');
            } else {
                const label = cmd === 'restock_on' ? 'Aktifkan Restock' : 'Matikan Restock';
                log(`Perintah dikirim: ${label}`, 'success');
            }
        });
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
        log('Dashboard siap');
        connect();
    });
</script>

</body>
</html>
